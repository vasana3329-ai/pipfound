name: pipfound health guard

# چرا «هر پوش» به «پوشِ main + هر PR» تغییر کرد: پوشِ یک شاخهٔ فیچر که PR باز دارد
# هم رویدادِ push و هم رویدادِ pull_request را می‌افروخت، پس همان چک دو بار اجرا
# می‌شد (دو برابر دقیقهٔ CI و دو ردیفِ تکراری در پنلِ PR). حالا:
#   • هر PR (باز شدن / پوشِ تازه / بازگشایی)  ←  pull_request   (پوششِ اصلیِ نگهبان)
#   • پوشِ main بعد از ادغام                 ←  push (branches: [main])
# اجرای دستی از تبِ Actions هم با workflow_dispatch ممکن است.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipfound-selfcheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selfcheck:
    name: pipfound-selfcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: دریافتِ کد
        uses: actions/checkout@v7

      - name: پایتون
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: نود (برای چکِ سینتکسِ جاوااسکریپت)
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # ── لایه‌ی ۱: چکِ سینتکسِ پایتون و JS + قراردادِ «هیچ کلیدی گم نشود» ──
      # مبنای مقایسه: فایلِ selfcheck-baseline.json که در گیت نگه داشته می‌شود.
      # چکِ استاتیکِ «تابعِ صدا زده شده ولی تعریف نشده» هم همین‌جاست (یافتهٔ S2):
      # node --check سینتکس را می‌گیرد ولی حذفِ تعریفِ یک تابع را نه؛ آن حالت
      # تا سرِ اجرا (ReferenceError) بی‌صدا می‌مانَد.
      # چکِ «اتصالِ HTML و JS» (یافتهٔ S3) و چکِ «قراردادِ PWA» (یافتهٔ S4) هم
      # استاتیک و در همین لایه‌اند: مسیرِ سرو‌نشده، آیکونِ ناموجود و پیش‌کشِ
      # ناقص هم بی‌صدا خرابی می‌سازند.
      - name: نگهبانِ سلامت (سینتکس + کلیدها + مسیرها + توابعِ تعریف‌نشده + اتصالِ HTML/JS + قراردادِ PWA)
        run: |
          set +e
          python3 selfcheck.py --json > /tmp/selfcheck.json
          rc=$?
          python3 selfcheck.py || true
          echo "── نتیجه‌ی نگهبان: exit=$rc ──"
          exit $rc

      # ── جهش‌آزماییِ لایه‌ی ۱: خودِ چکِ «تابعِ تعریف‌نشده» ──
      # یک گیتِ خراب‌نشده گیت نیست: اینجا با حذفِ عمدیِ تعریفِ یک تابع (همان
      # رگرسیونِ تاریخیِ closePick) و با افزودنِ فراخوانیِ یک نامِ ناموجود
      # ثابت می‌شود لایه‌ی ۱ **واقعاً** قرمز می‌شود؛ و با جهش‌های بی‌گناه (نام
      # داخلِ رشته/کامنت/regex، متدِ شیء، تعریفِ بعد از استفاده) ثابت می‌شود
      # بی‌دلیل هم قرمز نمی‌شود (اخطارِ دروغ = بازگردانیِ ناخواستهٔ کدِ سالم).
      - name: جهش‌آزماییِ چکِ توابعِ تعریف‌نشده (لایه‌ی ۱)
        run: |
          set -e
          python3 undefined_call_test.py

      # ── جهش‌آزماییِ لایه‌ی ۱: چکِ «اتصالِ HTML و JS» ──
      # idِ تکراری، ارجاعِ JS به idِ ساخته‌نشده، هندلرِ inline، و مهم‌تر از همه
      # `x.onclick = foo` (نامِ خالی، بدونِ پرانتز) که هیچ چکِ دیگری نمی‌بیندش.
      # هر دو سند جدا سنجیده می‌شوند: تعریف در HTML نباید ارجاعِ FUND_PAGE را
      # ماست کند. و برعکسش: مارک‌آپِ ساخته‌شده داخلِ رشتهٔ JS، idِ کامنت‌شده،
      # هندلرِ فلش/متد، و کلاسی که فقط JS/CSS استفاده‌اش می‌کند نباید قرمز کنند.
      # «استفاده‌نشده»ها فقط هشدارند (کدِ مرده خرابی نیست و نباید نگهبانِ
      # بازگردان را بی‌دلیل تحریک کند) — و آن هم با احتسابِ دارایی‌های وبِ بیرون
      # (ui_visual_check.cjs / sw.js): لنگرهایی که هارنسِ بصری وجودشان را لازم
      # دارد «مرده» شمرده نمی‌شوند، وگرنه هشدار، پاک‌کردنِ لنگرِ زنده را توصیه
      # می‌کرد و لایه‌ی ۳ می‌شکست.
      - name: جهش‌آزماییِ چکِ اتصالِ HTML/JS (لایه‌ی ۱)
        run: |
          set -e
          python3 wiring_check_test.py

      # ── جهش‌آزماییِ لایه‌ی ۱: چکِ «قراردادِ PWA» ──
      # نه سینتکسِ sw.js جایی سنجیده می‌شد و نه وعده‌های مانیفست/پوسته‌ی کش با
      # مسیرهای واقعیِ سرور مقابله می‌شد. بی‌صداترین حالتش: `addAll` با یک URLِ
      # ناموفق کلّاً رد می‌شود و `catch` خفه‌اش می‌کند — سرویس‌ورکر نصب می‌شود
      # ولی هیچ‌چیز پیش‌کش نکرده (آفلاینِ خالی). کنارش: آیکونِ ناموجود/سرو‌نشده،
      # `addAll(نامِ غلط)` یا نامِ ناهمخوانِ `caches.open`، کش‌کردنِ پاسخِ ناموفق
      # (بدونِ گاردِ `res.ok`) و کش‌کردنِ `/api/`.
      # کنارش، «خبرِ نسخهٔ تازهٔ سرِ بارگذاری» (S10): شنوندهٔ `updatefound` باید
      # باشد **و** بعد از وصل‌کردنش وضعیتِ کنونیِ ثبت بازخوانی شود — وگرنه نصبِ
      # سریعی که خودِ همین بارگذاری راه انداخته، بی‌بنر و بی‌صدا در صف می‌مانَد.
      # و کنارش، یادِ «بعداً»ی بنر (یادِ نشستی که بنرِ نسخهٔ تازه را می‌بندد ولی
      # پیامِ «برگردانِ نسخه» را نه) — و برعکسش: کامنتِ حاویِ مسیر، مرتب‌کردنِ
      # پوسته، مسیرِ سرو‌شدهٔ تازه و آیکونِ کاملاً سیم‌کشی‌شده نباید قرمز کنند.
      - name: جهش‌آزماییِ قراردادِ PWA (لایه‌ی ۱)
        run: |
          set -e
          python3 pwa_contract_test.py

      # ── لایه‌ی ۲: سرورِ واقعی بالا بیاید و صفحه و اندپوینت‌ها جواب بدهند ──
      - name: اسموک‌تستِ سرورِ واقعی
        run: |
          # PIPFOUND_NOTIFY=0: سرورِ آزمونِ CI هم کارگرِ آلارمِ فاندمنتال را سرِ بوت
          # می‌سنجد؛ خفه‌اش می‌کنیم تا هیچ اجرای CI نوتیفِ دسکتاپ نزند.
          PIPFOUND_NOTIFY=0 python3 app.py --port 8787 > /tmp/pipfound.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8787/api/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8787/api/health >/dev/null
          echo "سرور بالا آمد ✓"

          page="$(curl -sf http://127.0.0.1:8787/)"
          for id in go bt sym refreshBtn archiveBtn fundBtn sbBtn setupsBtn jbtn rkSave rkBalance rkRisk rkDaily rkOpen; do
            if ! printf '%s' "$page" | grep -q "id=\"$id\""; then
              echo "::error::کلیدِ «$id» در صفحه‌ی سرو‌شده نیست"
              exit 1
            fi
          done
          echo "همه‌ی کلیدهای اصلی در صفحه هستند ✓"

          curl -sf http://127.0.0.1:8787/manifest.webmanifest >/dev/null
          sw="$(curl -sf http://127.0.0.1:8787/sw.js)"
          if printf '%s' "$sw" | grep -q "__CACHE_REV__"; then
            echo "::error::sw.js سرو‌شده جای‌گذارِ خام دارد — نامِ کشِ سرویس‌ورکر جانشین نشده"
            exit 1
          fi
          if ! printf '%s' "$sw" | grep -qE 'const CACHE = "pipfound-[^"]+"'; then
            echo "::error::نامِ کشِ سرو‌شدهٔ sw.js به بازنگریِ کد گره نخورده"
            exit 1
          fi
          for id in pfSwBanner pfSwBtn pfSwHide; do
            if ! printf '%s' "$page" | grep -q "id=\"$id\""; then
              echo "::error::بنرِ «نسخهٔ تازه» ناقص است — «$id» در صفحه نیست"
              exit 1
            fi
          done
          echo "فایل‌های PWA سرو می‌شوند · نامِ کش = بازنگریِ کد · بنرِ به‌روزرسانی موجود است ✓"

          curl -sf http://127.0.0.1:8787/api/selfcheck \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('selfcheck داخلِ اپ:', d.get('ok')); sys.exit(0 if d.get('ok') else 1)"
          echo "اسموک‌تست پاس شد ✓"

      # ── گزارشِ دقیقِ خطاها روی همان کامیت/PR ──
      # ── لایه‌ی ۳: رندرِ واقعی در مرورگرِ headless — «کلیدها غیب نشده‌اند و سیم‌کشی‌اند؟» ──
      # چرا لازم است: یک خطای جاوااسکریپت، دکمه‌ها را در HTML نگه می‌دارد ولی بی‌اثر می‌کند؛
      # چکِ متنیِ HTML این را نمی‌بیند، ولی صفحه‌ی رندرشده لو می‌دهد.
      # این لایه قراردادِ نشانگر روی کرکره‌ی نمادها را هم قفل می‌کند (بندِ ۶.۷):
      #   • رفتنِ نشانگر روی کرکره پنل را نبندد (فرصتِ انتخابِ نماد بماند)،
      #   • پنل روی هیچ دکمه‌ای از ردیفِ جستجو ننشیند (کلیکِ «تحلیل کن» دزدیده نشود)،
      #   • انتخاب/دورشدنِ واقعی پنل را ببندد.
      # هر سه یک‌بار با هم شکستند و اپ را «خراب» نشان دادند؛ حالا رگرسیونشان CI را رد می‌کند.
      # بندِ ۹ هم همین‌جاست: قراردادِ PWA در عمل — سرویس‌ورکر واقعاً ثبت/فعال شود،
      # پوستهٔ کشِ خوانده‌شده از خودِ sw.js کامل پیش‌کش شود، و با قطعِ واقعیِ شبکه
      # (روی هدفِ صفحه **و** هدفِ سرویس‌ورکر) صفحه از کش بالا بیاید، آیکون از کش
      # بیاید و /api/ عمداً وصل نشود (داده‌ی زنده هرگز از کش).
      # بندِ ۹.۰/۹.۱: نامِ کش باید در پاسخِ سرو‌شده جانشین شده باشد و بنرِ
      # «نسخهٔ تازه» در عمل کار کند — در یک زمینهٔ جدای مرورگر نصبِ اول انجام
      # می‌شود، بعد یک نسخهٔ تازه ساخته می‌شود که باید در انتظار بماند، بنر دیده
      # شود و با یک کلیک فعال شود. این‌ها را هیچ چکِ متنی نمی‌بیند (جهش‌آزماییِ
      # خودِ این بند نشان داد: هم پیامِ به‌هدفِ‌غلط و هم بنرِ هیچ‌وقت‌دیده‌شده
      # برای نگهبانِ استاتیک سبزند).
      # بندِ ۹.۲: «بعداً»ی بنر تا پایانِ همان بازدید یادش می‌مانَد (بارگذاریِ
      # دوباره بنر را برنمی‌گرداند) ولی در بازدیدِ تازه برمی‌گردد — سه‌گانهٔ
      # «دیدن → بعداً → برگشت در بازدیدِ تازه» نمی‌گذارد بنرِ مرده سبزِ دروغ شود.
      # بندِ ۹.۳: نسخهٔ تازه‌ای که **خودِ همین بارگذاری** راهش می‌اندازد هم بنر
      # می‌دهد — مسابقهٔ چندمیلی‌ثانیه‌ای «امیدوار» آزموده نمی‌شود: پاسخِ PF_WHO
      # عمداً دیر می‌شود تا پنجرهٔ مسابقه قطعی پهن شود؛ روی کدِ قبلِ اصلاح همین بند
      # قرمز می‌شد و روی کدِ فعلی سبز است.
      # مسیرِ **خرابی** (نصبِ نیمه‌کاره → ترمیم یا برگردان) در گامِ بعدی است،
      # `sw_upgrade_check.cjs`.
      - name: تستِ بصری و سیم‌کشیِ کلیدها (headless)
        run: |
          set -e
          MODDIR="$RUNNER_TEMP/pf-visual"
          mkdir -p "$MODDIR"
          ( cd "$MODDIR" && npm init -y >/dev/null 2>&1 && npm i puppeteer-core@24 --no-audit --no-fund --silent )
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "مرورگری روی رانر نبود — کرومِ headless نصب می‌شود"
            BROWSER="$(npx --yes @puppeteer/browsers install chrome@stable --path "$MODDIR/browsers" | tail -1 | awk '{print $NF}')"
          fi
          echo "مرورگر: $BROWSER"
          PF_BROWSER="$BROWSER" PF_PUPPETEER_DIR="$MODDIR/node_modules" \
            node ui_visual_check.cjs --url http://127.0.0.1:8787/ --shot "$RUNNER_TEMP/pf-ui.png"

      # ── لایه‌ی ۳.۵: ارتقای ایمنِ نسخه (ترمیم و برگردان) ──
      # چرا لازم است: لایه‌ی ۱ قراردادِ ارتقا را استاتیک می‌سنجد و خودِ اپ هم سرِ بوت
      # نسخه‌ی استاتیکاً خراب را برمی‌گرداند؛ ولی **خرابیِ زمانِ نصب** (یک ۴۰۴ یا
      # خطای گذرا که `addAll` را رد می‌کند) هیچ چکِ متنی نمی‌بیند. این تست سه نسخه را
      # روی یک مرورگرِ واقعی اجرا می‌کند: مبنا → نصبِ ناقصِ ترمیم‌شدنی (باید از کشِ
      # قبلی ترمیم شود) → نصبِ ناقصِ ترمیم‌نشدنی (باید **برگردان** شود و آفلاین بماند).
      # همه‌چیز در یک کپیِ موقت با سرورِ جداگانه است؛ به مخزن/سرورِ 8787 دست نمی‌زند.
      - name: ارتقای ایمنِ نسخه — ترمیم و برگردان (headless)
        run: |
          set -e
          MODDIR="$RUNNER_TEMP/pf-visual"
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ] && [ -d "$MODDIR/browsers" ]; then
            BROWSER="$(find "$MODDIR/browsers" -type f -name chrome -perm -u+x | head -1)"
          fi
          if [ -z "$BROWSER" ]; then
            echo "::error::مرورگری برای تستِ ارتقای ایمن پیدا نشد"
            exit 1
          fi
          PF_BROWSER="$BROWSER" PF_PUPPETEER_DIR="$MODDIR/node_modules" \
            node sw_upgrade_check.cjs --port 8795

      # ── لایه‌ی ۴: رفت‌وبرگشتِ ژورنال — مسیرِ دفتر، ثبت/خواندن، مهاجرتِ بی‌خطر ──
      # خودش نمونه‌های موقتِ اپ را با HOME و env کنترل‌شده بالا می‌آورد، پس به سرورِ 8787
      # و دفترِ واقعیِ کاربر دست نمی‌زند.
      - name: تستِ رفت‌وبرگشتِ ژورنال (مسیرِ دفتر)
        run: |
          set -e
          python3 journal_roundtrip_test.py

      # ── لایه‌ی ۴.۵: صداقتِ داده (کندلِ بسته + سنِ داده/باز-بستهی بازار) ──
      # کاملاً آفلاین و قطعی (کندلِ ساختگی): هرگز تحلیل روی کندلِ ناقص انجام نشود،
      # بازارِ بسته درجه را ببندد و پلن «قابلِ اجرا» علامت نخورد، و بک‌تست کندلِ
      # هنوز-بازِ تایم‌فریمِ بالا را (که داده‌ی آینده است) نبیند.
      - name: تستِ تازگیِ داده و کندلِ بسته
        run: |
          set -e
          python3 data_freshness_test.py

      # ── لایه‌ی ۴.۶: مدلِ ریسک (سایزِ پوزیشن، سقفِ ضررِ روزانه، هم‌بستگی) ──
      # کاملاً آفلاین و قطعی: مشخصاتِ قرارداد، فرمولِ سایز، گاردها، و هشدارِ
      # تمرکز. «۱:۳» بدونِ سایز یک عددِ تزئینی است؛ این لایه نمی‌گذارد فرمولِ
      # سایز یا سقفِ ضررِ روزانه بی‌صدا عوض شود.
      - name: تستِ مدلِ ریسک
        run: |
          set -e
          python3 risk_test.py

      # ── لایه‌ی ۴.۷: PWA/نصب روی دستگاه (مانیفست، سرویس‌ورکر، گیتِ توکن) ──
      # آفلاین و قطعی: مانیفستِ نصب‌پذیر، «داده‌ی زنده هرگز کش نمی‌شود»،
      # ورودِ کوکییِ توکن (POST بدونِ توکن → 401) و گزارشِ /api/install.
      - name: تستِ PWA/نصب
        run: |
          set -e
          python3 pwa_test.py

      # ── لایه‌ی ۴.۸: SMT دایورجنس + هشدارِ خلافِ جهت در جفت‌های همبسته ──
      # آفلاین و قطعی (کندل‌های سینتیک): جدولِ جفت‌ها، تشخیصِ HH/LH و LL/HL،
      # هم‌فازیِ سوئینگ‌ها، هشدارِ «تریدِ خلافِ جهت» در risk.correlation،
      # و چراغِ ستاپِ چهارمِ اپ.
      - name: تستِ SMT/همبستگی
        run: |
          set -e
          python3 smt_test.py

      # ── لایه‌ی ۴.۹: انتقالِ دادهٔ کاربر (برون‌بری/درون‌بریِ JSON: ژورنال/آلارم/تنظیمات) ──
      # آفلاین + رفت‌وبرگشتِ واقعی روی نمونه‌های موقتِ اپ: بستهٔ کاملِ برون‌بری،
      # درون‌بریِ بی‌خطر و تکرارپذیر (بدونِ حذفِ داده)، اعتبارسنجیِ پیش از نوشتن
      # (بستهٔ خراب ۴۰۰ می‌گیرد و هیچ فایلی را عوض نمی‌کند)، و جهش‌آزماییِ
      # قاعدهٔ نگهبانِ «انتقالِ داده» در لایهٔ ۱.
      - name: تستِ انتقالِ دادهٔ کاربر
        run: |
          set -e
          python3 backup_test.py

      # ── لایه‌ی ۴.۱۰: پشتیبانِ خودکارِ زمان‌بندی‌شده + نگه‌داشتِ نسخه‌ها ──
      # آفلاین + رفت‌وبرگشتِ واقعی روی نمونه‌های موقتِ اپ: ساختِ نسخه از همان
      # بستهٔ برون‌بری، نگه‌داشتِ چند نسخهٔ اخیر، **هرسِ فقط فایل‌های پشتیبان**
      # (فایلِ بیگانه در همان پوشه دست‌نخورده می‌مانَد)، نوشتنِ اتمیک بدونِ فایلِ
      # موقتِ بازمانده، خواندنِ بی‌خطرِ نسخه با ?file (و بسته‌بودنِ مسیرِ
      # بیرون‌زدن)، و جهش‌آزماییِ قاعدهٔ نگهبانِ «پشتیبانِ خودکار» در لایهٔ ۱.
      - name: تستِ پشتیبانِ خودکار
        run: |
          set -e
          python3 autobackup_test.py

      # ── لایه‌ی ۴.۱۱: تستِ عددیِ طلاییِ موتور (سوینگ/FVG/OB/ساختار/PD-OTE) ──
      # آفلاین و کاملاً قطعی: یک سریِ ۳۸کندلیِ دست‌ساز با اعدادِ انتخاب‌شده،
      # بدونِ شبکه و بدونِ تصادف. مقادیرِ سوینگ/FVG/اُردربلاک/CHoCH-MSS/PD-OTE/
      # لیکوئیدیتی/سوئیپ/دیسپلیسمنت را عددبه‌عدد قفل می‌کند و بعد مرزِ عددیِ هر
      # آستانه را با جفت‌های لبهای می‌سنجد (تغییرِ پنهانِ disp_mult از ۱.۵ به
      # ۱.۴ یا نرم‌کردنِ ضریبِ ۱.۳ دیسپلیسمنت حالا تست را قرمز می‌کند)؛ در پایان
      # خودش ۱۲ جهش روی کپیِ موقتِ smc_engine.py می‌زند (۱۰ سرخ + ۲ بی‌گناه).
      - name: تستِ عددیِ طلاییِ موتور
        run: |
          set -e
          python3 engine_golden_test.py

      # ── لایه‌ی ۴.۱۲: تستِ «کندلِ ناقص» (موتور روی کندلِ بسته‌نشده سیگنال نمی‌سازد) ──
      # آفلاین و قطعی: سه لایهٔ دفاعی را قفل می‌کند — ۱) نقطهٔ گلوگاهِ drop_unclosed
      # در مسیرِ زنده (fetch) و بک‌تست (_build_d) با مرزِ دقیقِ t+tf ≤ now؛ ۲) گیتِ
      # خودِ هستهٔ analyze_bars که روی کندلِ ناقص خطای صریح می‌دهد (نه سبزِ خاموش)؛
      # ۳) گیتِ گریدر که فلگِ data.forming را می‌گیرد (سقفِ درجه C، executable_now
      # False، مهرِ ورودِ صادرنشده). در پایان روی کپیِ موقتِ ماژول‌ها ۷ جهش می‌زند
      # (۵ سرخ + ۲ بی‌گناه) و شکستِ هر جهش باید *نام‌دار* باشد، نه کرشِ اتفاقی.
      # گاردِ آفلاینِ خودِ تست شبکه را می‌بندد (وگرنه گیتِ اخبارِ کلان در گریدر
      # تقویمِ اقتصادی را از اینترنت می‌گرفت و زمانِ اجرا به شبکه گره می‌خورد).
      - name: تستِ کندلِ ناقص
        run: |
          set -e
          python3 partial_candle_test.py

      # ── لایه‌ی ۴.۱۳: تستِ «هم‌بستگیِ عددی» (ضرایبِ مرجع + تذکرِ تخلفِ کاربر) ──
      # آفلاین و قطعی: جدولِ ۱۹ ضریبِ مرجع (BTC↔ETH ‎+۰٫۸۵، طلا↔دلار ‎-۰٫۸۵،
      # طلا↔USDCAD ‎-۰٫۵۵ = «طلا با دلارِ کانادا مثبت»، نفت↔USDCAD، یورو↔دلار
      # این‌دکس، شاخص‌های آمریکا، …) و سه کلاسِ تخلف با عدد در متنِ هشدار:
      # ‎① هم‌جهت روی ضریبِ مثبت = ریسکِ تکراری (ریسکِ مؤثر ‎۱+Σ|ضریب|)،
      # ‎② هم‌جهت روی ضریبِ منفی = دو سناریوی متضاد، ‎③ خلافِ‌جهت روی ضریبِ
      # مثبت = هجِ ناخواسته (فقط اسپرد می‌سوزد). مرزهای ۰٫۳/۰٫۵ قفل‌اند،
      # فهرستِ نمایشی تکرارِ لایهٔ فاکتوری را حذف می‌کند، و در پایان روی کپیِ
      # موقتِ ماژول‌ها ۱۰ جهش می‌زند (۸ سرخ + ۲ بی‌گناه).
      - name: تستِ هم‌بستگیِ عددی
        run: |
          set -e
          python3 correlation_test.py

      # ── لایه‌ی ۴.۱۴: تستِ «هم‌ترازیِ ۴ساعته» (تجمیعِ H4 روی مرزهای واقعیِ UTC) ──
      # آفلاین و قطعی: قفلِ رفتارِ تجمیعِ تایم‌فریمِ H4 که چارتِ کارگزار را با اپ
      # یکی می‌کند. ریشهٔ باگ: `resample` سبدها را از *ابتدای آرایه* می‌بست
      # (range(0, len-len%n, n))؛ چون Yahoo برای ۴ساعته دادهٔ ۱ساعته می‌دهد و
      # اولین کندلش روی مرز نیست، سبدهای «۴ساعته» روی ۰۱:۰۰–۰۵:۰۰ می‌نشستند.
      # حالا کلید هر سبد `t // 14400 * 14400` است و فقط سبدهای کامل منتشر
      # می‌شوند (سبدِ ناقصِ ابتدا/انتها و حفرهٔ داده می‌افتد — هم‌راستا با
      # drop_unclosed). تست اعدادِ طلاییِ OHLCV را دستی‌محاسبه چک می‌کند، هم‌ترازیِ
      # منبعِ آفست‌شده و بی‌تفاوتی به جابه‌جاییِ یک تایم‌فریمِ کامل را می‌سنجد، و
      # نشان می‌دهد ناهم‌ترازی جهتِ پایِ ایمپالس و رِنجِ PD/OTE را عوض می‌کند
      # (ناهم‌خوانیِ چارت بی‌صدا نمی‌ماند). در پایان روی کپیِ موقتِ ماژول‌ها
      # ۷ جهش می‌زند (۵ سرخ + ۲ بی‌گناه) و شکست باید *نام‌دار* باشد.
      - name: تستِ هم‌ترازیِ ۴ساعته
        run: |
          set -e
          python3 h4_alignment_test.py

      # ── لایه‌ی ۴.۱۵: خفه‌بودنِ نوتیفیکیشن در تست‌ها ──
      # چرا لازم است (شکایتِ واقعیِ کاربر: «پشتِ‌سرِهم نوتیف می‌ده توو دسکتاپ»):
      # کارگرِ آلارمِ فاندمنتال **سرِ بوت و در همان اولین دور** خبرِ ۲۳–۲۵ ساعتِ
      # آینده را می‌بیند و نوتیفِ واقعیِ مک می‌فرستد؛ و هر تستی که اپ را با HOMEِ
      # تازه بالا می‌آورد یعنی «فایلِ dedupe وجود ندارد» ⇒ نوتیف می‌رود و هر
      # `execv`ِ ری‌استارت هم دوباره. یعنی خودِ تست‌ها روی دسکتاپِ کاربر نوتیف
      # می‌فرستادند (شمارشِ `osascript` همین را نشان داد). این لایه سه چیز را
      # قفل می‌کند: (۱) قاعدهٔ استاتیکِ لایهٔ ۱ — دروازهٔ `PIPFOUND_NOTIFY` در
      # `_notify_mac` پیش از `osascript`، و خفه‌بودنِ **هر ۸ نقطهٔ پرتابِ** اپ
      # (۷ تست/هارنس — شاملِ خودِ تستِ همین لایه — + گامِ CI؛ مقدار باید صریحاً
      # «۰» باشد، نه فقط بودِنِ کلید)؛
      # (۲) جهش‌آزماییِ همان قاعده (برداشتنِ دروازه، جابه‌جایی‌اش به بعد از
      # پرتاب، نخواندنِ کلید، خالی‌کردنِ فهرستِ خاموش، برداشتنِ کلید از هر
      # نقطهٔ پرتاب، و کامنتِ دروغین)؛ (۳) **اثباتِ رفتاری** با `osascript`ِ جعلی
      # روی PATH و تقویمِ ثابتِ آفلاین: پیش‌فرضِ اپ باید نوتیف بزند (شاهدِ مثبت
      # — همان ریشهٔ شکایت)، با `PIPFOUND_NOTIFY=0` صفر نوتیف برود درحالی‌که
      # کارگر اجرا شده، و کنترلِ منفی (دروازهٔ بی‌اثرشده در کپی) باز نوتیف بزند.
      - name: تستِ خفه‌بودنِ نوتیفیکیشن
        run: |
          set -e
          python3 notify_mute_test.py

      # ── لایه‌ی ۴.۱۶: نتیجه‌ی قطعی در آرشیوِ اقتصادی ──
      # خواسته‌ی کاربر: بعد از اعلامِ خبر، آرشیو باید **مطلق** بگوید «عددِ اعلام‌شده
      # + بالاتر/پایین‌تر از انتظار + صعودی/نزولی» — نه گزاره‌ی شرطیِ «اگر بالاتر شد
      # → …». زنجیره: گیرنده‌ی Actual (macro_context.get_actuals از تقویمِ Trading
      # Economics — فیدِ FF اصلاً actual ندارد) → حکم (_verdict در fundamental.py،
      # مقایسه با پیش‌بینی‌ی همان تقویمِ FF؛ شاخصِ معکوس رعایت می‌شود؛ بدونِ عدد ⇒
      # «نامعلومِ صادق»، حدس ممنوع) → رندرِ خطِ «نتیجه» در پنجره‌ی آرشیو (app.py).
      # این لایه قفل می‌کند: (۱) قاعده‌ی استاتیکِ selfcheck.archive_problems روی
      # مخزنِ سالم صفر خطا؛ (۲) جهش‌آزمایی — حذفِ گیرنده، خرابیِ الگوی پارسر،
      # قطعِ تزریقِ حکم، برداشتنِ صعودی/نزولی یا عدد یا پیامِ «منبع در دسترس نبود»
      # همه نام‌دار قرمز می‌شوند؛ (۳) رفتارِ خالصِ _verdict روی جدولِ ثابت
      # (صعودی/نزولی/خنثی/معکوس/نامعلوم). آفلاین و چندثانیه‌ای.
      #
      # دورِ دومِ همین خواسته (کاربر: «می‌خوام توو آرشیو اقتصادی فقط نتیجه بیاد
      # بعلاوهٔ تأثیرش، نه گزارهٔ شرطی»): دو سطرِ شرطیِ «⬆ اگر بالاتر شد → … /
      # ⬇ اگر پایین‌تر شد → …» از پنجرهٔ آرشیو رفتند و جایشان **تأثیرِ محقَقِ
      # همان نتیجه** نشست (`_realized_effect` از جهتِ واقعیِ حکم + کلیدِ `effect`
      # در payload + خطِ «تأثیرِ همین نتیجه»). این لایه حالا قفل می‌کند که:
      # منطقهٔ خودِ آرشیو هیچ `a.beat`/`a.miss` نداشته باشد، payloadِ آرشیو اصلاً
      # `analysis` (دو شاخهٔ شرطی) نفرستد، خبرِ بی‌عدد ردیفِ خالی/ساکت ندهد، و
      # خبرهای **پیش‌رو** عمداً دو سناریوی خود را نگه دارند (عددشان اعلام نشده).
      - name: تستِ نتیجه + تأثیرِ آرشیو (بی‌گزارهٔ شرطی)
        run: |
          set -e
          python3 archive_actual_test.py

      # ── لایه‌ی ۴.۱۷: «کلیدِ بی‌واکنش نداریم» ──
      # شکایتِ واقعیِ کاربر: «چک کن خیلی از کلیدا رو از کار انداختی که؟! مثلا
      # فاندمنتال و به‌روزرسانی رو.» راستی‌آزماییِ زنده نشان داد کلیدها *سالم*
      # بودند ولی دو بی‌صداییِ واقعی هرکدام یک کلید را «خراب» جلوه می‌داد:
      # (۱) کلیدِ فاندمنتال تنها جای `window.open` بود؛ در نصبِ PWA
      # (`display-mode: standalone`) و با پاپ‌آپ‌بلاکر مقدارِ NULL برمی‌گردد و
      # کدِ قبلی نمی‌سنجیدش ⇒ نه تبی، نه پیامی، نه حرکتی (کلیدِ مرده)؛
      # (۲) پیامِ «چیزی برای بروزرسانی نیست» داخلِ `.rf-live`ِ sr-only می‌رفت
      # (`width:1px` برای صفحه‌خوان) ⇒ کاربرِ بینا هیچ واکنشی نمی‌دید.
      # این لایه قفل می‌کند: (۱) قاعده‌ی استاتیکِ selfcheck.button_alive_problems
      # روی مخزنِ سالم صفر خطا؛ (۲) جهش‌آزمایی — حذفِ هندلر، برداشتنِ هر دو
      # ناوبری، برداشتنِ سنجشِ NULL، برداشتنِ تورِ هم‌تب، و حذفِ پیام/فلاشِ دیدنی
      # همه نام‌دار قرمز می‌شوند؛ پاک‌سازی‌های بی‌گناه سبز می‌مانند؛ (۳) رفتارِ
      # خالصِ خودِ هندلر با node در سه حالتِ «پاپ‌آپِ مسدود (NULL) / مجاز /
      # پرت‌کردن» + «شاهدِ باگ» از هندلرِ نسخهٔ قبل که ثابت می‌کند شکایت واقعی
      # بوده و قاعده از هوا ساخته نشده. آفلاین و چندثانیه‌ای.
      - name: تستِ کلیدِ بی‌واکنش
        run: |
          set -e
          python3 button_alive_test.py

      # ── لایه‌ی ۴.۱۸: کرکره‌های «جمعِ پیش‌فرض»ِ نمای اصلی ──
      # خواستهٔ کاربر: «اون بخش پشتیبان و انتقالِ داده فقط یه کلید باشه که روش
      # کلیک بشه و کرکره‌ی گزینه‌هاش باز بشه؛ الان صفحه اصلی رو شلوغ و بچه‌گونه
      # نشون می‌ده» و بعد: «پنل‌های همیشه‌بازِ دیگرِ نمای اصلی (آلارم‌های فعال،
      # بازهٔ بک‌تست و مدیریتِ ریسک) را هم جمع‌شدنی کن». این لایه قفل می‌کند:
      # (۱) قاعده‌ی استاتیکِ selfcheck.fold_panels_problems روی مخزنِ سالم — هر
      # چهار بخش نوارِ کلیدپذیر با aria دارند، بدنه پیش‌فرض پنهان است، گزینه‌های
      # پشتیبان **داخلِ** بدنه‌اند، خلاصهٔ وضعیت روی نوار دیده می‌شود، و هیچ
      # قاعدهٔ CSSی بعدتر روی خودِ بدنه display نمی‌گذارد (تلّهٔ واقعیِ این دور:
      # یک display:flexِ هم‌ارز، پنهان‌بودن را بی‌اثر کرد و پنل همیشه‌باز ماند)؛
      # (۲) جهش‌آزمایی — برداشتنِ کلاسِ کرکره/پنهان‌بودنِ بدنه/قاعدهٔ بازشدن/
      # سیم‌کشی/aria/خلاصهٔ وضعیت یا بیرون‌بردنِ گزینه‌ها همه باید **نام‌دار**
      # قرمز شوند و پاک‌سازی‌های بی‌گناه (گلیفِ فلش، فاصله‌ی داخلی، کلاسِ نمایشیِ
      # اضافه، متنِ توضیح، قاعدهٔ اختصاصیِ باز شدن) سبز بمانند. رفتارِ واقعیِ
      # باز/بسته‌شدن هر چهار بخش در لایه‌ی ۳ (بندِ ۶.۹ در ui_visual_check.cjs) روی
      # مرورگرِ واقعی سنجیده می‌شود.
      - name: تستِ کرکره‌های نمای اصلی (جمعِ پیش‌فرض)
        run: |
          set -e
          python3 dock_collapse_test.py

      # ── لایه‌ی ۴.۱۹: یادِ «باز/بسته»ی کرکره‌های نمای اصلی بینِ بازدیدها ──
      # خواسته‌ی کاربر: «وضعیتِ باز/بستهٔ کرکره‌های نمای اصلی را بینِ بازدیدها
      # یادت بماند تا هر بخش همان‌طور که کاربر گذاشته بماند». این لایه قفل
      # می‌کند که انتخابِ کاربر زیرِ کلیدِ pf-folds در localStorage بنشیند،
      # بازگردانی **پیش از** رنگ‌آمیزی/سیم‌کشی انجام شود (وگرنه رنگ‌آمیزیِ
      # اولیه وضعیت را می‌بَرد)، نوشتن داخلِ همان هندلرِ کلیک باشد، و نبودِ
      # یاد/خرابیِ یاد یعنی پیش‌فرضِ تمیز (همه بسته) — نه بخشی که خودسر باز
      # می‌مانَد. چون هیچ مرورگری در این گام نیست، رفتار با اجرای توابعِ
      # واقعیِ استخراج‌شده روی DOM/localStorageِ جعلی در node سنجیده می‌شود.
      - name: تستِ یادِ وضعیتِ کرکره‌ها (بینِ بازدیدها)
        run: |
          set -e
          python3 fold_memory_test.py

      # ── لایه‌ی ۴.۲۰: سوییچِ خودکارِ فید بعد از اعلامِ عدد ──
      # خواسته‌ی کاربر: «فیدِ خبرهای پیش‌رو را طوری کن که بعد از اعلامِ عدد،
      # خودکار از گزارهٔ شرطی به «نتیجه + تأثیرِ محقق» سوییچ کند — نه دو
      # سناریوی همیشگی.» فید تا اعلامِ خبر دو سناریو دارد (عدد نیامده؛ «اگر…»
      # تنها حرفِ درست است)؛ از لحظهٔ اعلام، همان کارت باید «نتیجه + تأثیر»
      # بدهد. این لایه قفل می‌کند: (۱) قاعده‌ی استاتیکِ
      # selfcheck.feed_switch_problems روی مخزنِ سالم صفر خطا؛ (۲) جهش‌آزمایی —
      # حذفِ سازندهٔ رویدادِ گذشته، برگشتِ `analysis` به بارِ آن، قطعِ تزریقِ
      # حکم، خراب‌شدنِ «نزدیک‌ترین خبر»، برداشتنِ سنجشِ `e.passed` یا کارتِ
      # نتیجه یا خطِ تأثیر یا ردیفِ صادقِ انتظار یا سناریوهای پیشِ‌رو همه نام‌دار
      # قرمز می‌شوند؛ (۳) رفتارِ خالصِ build_feed/build با تقویمِ ساختگی —
      # رویدادِ گذشته `passed` + `verdict` + بی‌`analysis`، پیشِ‌رو دو سناریو،
      # و `past_hours=0` تمیز. آفلاین و چندثانیه‌ای.
      - name: تستِ سوییچِ خودکارِ فید (اعلام → نتیجه + تأثیر)
        run: |
          set -e
          python3 feed_switch_test.py

      # ── لایه‌ی ۴.۲۱: پنجرهٔ گذشتهٔ فید + بجِ زندهٔ «N دقیقه پیش» ──
      # خواسته‌ی کاربر: «بجِ «N دقیقه پیش» کارت‌های اعلام‌شده را بدونِ رفرشِ
      # کلِ صفحه زنده کن و پنجرهٔ رویدادهای گذشته را با یک انتخابگر مثل ۶/۱۲/۲۴
      # ساعت قابلِ تنظیم کن.» این لایه قفل می‌کند: (۱) قاعده‌ی استاتیکِ
      # selfcheck.feed_window_problems روی مخزنِ سالم صفر خطا؛ (۲) جهش‌آزمایی —
      # حذفِ سقفِ پنجره‌ها، بی‌اثرکردنِ `past_window`، جداکردنِ انتخابگر از
      # درخواست، برگرداندنِ تیکِ بج به بازخوانیِ کامل، برداشتنِ `data-m`/`T0`/
      # زمان‌بند، و بسته‌شدنِ کارتِ باز در رندرِ دوره‌ای همه نام‌دار قرمز می‌شوند؛
      # (۳) رفتارِ خالصِ `past_window` روی ورودی‌های مرزی و پنجرهٔ ۶/۱۲/۲۴ روی
      # تقویمِ ساختگی (رویدادِ ۸ ساعتِ پیش در ۶ نمی‌آید، در ۱۲ می‌آید). آفلاین
      # و چندثانیه‌ای.
      - name: تستِ پنجرهٔ گذشتهٔ فید و بجِ زندهٔ اعلام
        run: |
          set -e
          python3 feed_window_test.py

      # ── لایه‌ی ۴.۲۲: سوییچِ لحظه‌ایِ اعلام (بدونِ رفرش و بدونِ پنجرهٔ ۶۰ثانیه‌ای) ──
      # خواسته‌ی کاربر: «کاری کن کارتِ پیش‌رو درست در لحظهٔ رسیدنِ شمارشِ معکوس به
      # صفر خودکار به حالتِ «اعلام شد» سوییچ کند و نتیجه را بیاورد — بدونِ
      # رفرشِ صفحه و بدونِ پنجرهٔ یک‌دقیقه‌ایِ فعلی.» این لایه قفل می‌کند: (۱) قاعدهٔ
      # استاتیکِ selfcheck.feed_flip_problems روی مخزنِ سالم صفر خطا؛ (۲) جهش‌آزمایی —
      # برداشتنِ لنگرِ ثانیه‌ای (`in_s`)، بی‌سقف‌کردن/حذفِ تکرار، برداشتنِ گاردِ
      # «هنوز اعلام نشده»، برگرداندنِ سوییچ به بازسازیِ کلِ فهرست، خواندنِ لنگر با
      # کلیدِ اشتباهِ dataset، یا خراب‌کردنِ خوانندهٔ عدد («195K»/عددهای منفی) همه
      # نام‌دار قرمز می‌شوند — به‌علاوهٔ یک جهشِ **رفتاری** که ثابت می‌کند ادعای
      # «دقتِ ثانیه‌ای» دندان دارد؛ (۳) رفتارِ خالصِ `one_event`/`in_s` با تقویمِ
      # ساختگی. آفلاین و چندثانیه‌ای.
      - name: تستِ سوییچِ لحظه‌ایِ اعلام (پیشِ‌رو → اعلام‌شده)
        run: |
          set -e
          python3 feed_flip_test.py

      # ── لایه‌ی ۴.۱۹: پرسشِ تأییدِ شکافِ ارزش منصفانه (FVG) ──
      # خواسته‌ی کاربر: «روندی طراحی کن که تشخیص بدهد کدام شکافِ ارزش منصفانه
      # تأییدِ بیشتری دارد و می‌شود به آن اتکا کرد؛ باید به شکلِ پرسش باشد —
      # کاربر آدرسِ شکاف را در یک تایم‌فریمِ مشخص می‌دهد و اپ تأییدش را
      # بررسی می‌کند.» این لایه قفل می‌کند: (۱) قاعدهٔ استاتیکِ
      # selfcheck.gap_query_problems روی مخزنِ سالم صفر خطا؛ (۲) جهش‌آزمایی —
      # برگرداندنِ گیتِ دیسپلیسمنت به پویشِ گپ (که آدرسِ درستِ کاربر را «پیدا
      # نشد» می‌کند)، افتادنِ هر یک از دوازده بندِ امتیاز، «قابلِ اتکا» شدنِ
      # درجه‌های میانی، بیرون‌رفتنِ آستانه‌ها از بازهٔ معقول، یا شکستنِ سیم‌کشیِ
      # اندپوینت/پنل همه نام‌دار قرمز می‌شوند — به‌علاوهٔ یک جهشِ **رفتاری** که
      # ثابت می‌کند سقفِ «گپِ مصرف‌شده» دندان دارد (برداشتنش ⇒ حکمِ «قابلِ
      # اتکا» روی گپِ مُرده)؛ (۳) رفتارِ خالص با کندلِ ساختگی: شمارشِ ۱۲ بند،
      # سقفِ ۱۳٫۵، گپِ تازه ⇒ A+/قابلِ اتکا، گپِ پرشده ⇒ C/غیرقابلِ اتکا و
      # آدرسِ بی‌ربط ⇒ «نمی‌خورد» + نزدیک‌ترین گپ‌ها. آفلاین و چندثانیه‌ای.
      - name: تستِ پرسشِ تأییدِ شکافِ ارزش منصفانه (FVG)
        run: |
          set -e
          python3 gap_query_test.py

      # ── لایه‌ی ۵: ری‌استارتِ خودکارِ «کدِ کهنه» ──
      # مثلِ تستِ ژورنال، روی کپیِ موقتِ پروژه و پورتِ تصادفی کار می‌کند:
      # (الف) ری‌استارتِ واقعی با همان PID و سرو شدنِ کدِ تازه، (ب) کشته نشدنِ
      # سرورِ سالم وقتی کدِ تازه خراب است، (ج) قطع نکردنِ درخواستِ در جریان،
      # (د) ری‌استارت روی «فقط SHA عوض شده» (کامیتی که هیچ فایلِ تعیین‌کننده‌ای
      # را لمس نمی‌کند) و (ه) **صداقتِ همان پرچم در جهتِ مخالف**: وقتی
      # PIPFOUND_AUTORESTART=0 است، اپ باید صادقانه «کهنه» بماند، SHAِ تازه را
      # بی‌ری‌استارت «نپذیرد» و هیچ‌وقت سبزِ دروغ (stale=false با کدِ کهنه) ندهد
      # — به‌همراهِ کنترلِ منفی که پرچم را عمداً دروغگو می‌کند تا ثابت شود این
      # ادعاها واقعاً دندان دارند.
      - name: تستِ ری‌استارتِ خودکارِ کدِ کهنه
        run: |
          set -e
          python3 autorestart_test.py

      # ── لایه‌ی ۶: نگهبانِ بازگشتِ خودکار (selfcheck_watcher.py) ──
      # کاملأ سندباکسی: `origin`ِ بَرِ محلی + `gh`ِ جعلی روی PATH؛ بدونِ شبکه و
      # بدونِ دست‌زدن به گیت‌هابِ واقعی. ثابت می‌کند برگشت فقط با شروطِ امنیت
      # انجام می‌شود و در هر شش حالتِ ناایمن مسدود می‌ماند.
      - name: تستِ نگهبانِ برگشتِ خودکار
        run: |
          set -e
          python3 selfcheck_watcher_test.py

      - name: گزارشِ خطاها
        if: failure()
        run: |
          echo "──────── لاگِ سرور ────────"
          tail -40 /tmp/pipfound.log 2>/dev/null || true
          echo "──────── گزارشِ نگهبان ────────"
          python3 selfcheck.py --json > /tmp/report.json || true
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("/tmp/report.json", encoding="utf-8"))
          except Exception:
              raise SystemExit(0)
          print("مبنا:", d.get("baseline"), "| موتورِ JS:", d.get("engine"))
          for p in (d.get("problems") or []):
              print("::error::" + p)
          for w in (d.get("warnings") or []):
              print("::warning::" + w)
          PY

      # اسکرین‌شاتِ تستِ بصری — برای بازبینیِ انسانی، حتی وقتی تست پاس می‌شود.
      - name: آپلودِ اسکرین‌شاتِ UI
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipfound-ui-screenshot
          path: ${{ runner.temp }}/pf-ui.png
          if-no-files-found: ignore
          retention-days: 7
