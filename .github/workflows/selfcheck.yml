name: pipfound health guard

# چرا «هر پوش» به «پوشِ main + هر PR» تغییر کرد: پوشِ یک شاخهٔ فیچر که PR باز دارد
# هم رویدادِ push و هم رویدادِ pull_request را می‌افروخت، پس همان چک دو بار اجرا
# می‌شد (دو برابر دقیقهٔ CI و دو ردیفِ تکراری در پنلِ PR). حالا:
#   • هر PR (باز شدن / پوشِ تازه / بازگشایی)  ←  pull_request   (پوششِ اصلیِ نگهبان)
#   • پوشِ main بعد از ادغام                 ←  push (branches: [main])
# اجرای دستی از تبِ Actions هم با workflow_dispatch ممکن است.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipfound-selfcheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selfcheck:
    name: pipfound-selfcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: دریافتِ کد
        uses: actions/checkout@v7

      - name: پایتون
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: نود (برای چکِ سینتکسِ جاوااسکریپت)
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # ── لایه‌ی ۱: چکِ سینتکسِ پایتون و JS + قراردادِ «هیچ کلیدی گم نشود» ──
      # مبنای مقایسه: فایلِ selfcheck-baseline.json که در گیت نگه داشته می‌شود.
      - name: نگهبانِ سلامت (سینتکس + کلیدها + مسیرها)
        run: |
          set +e
          python3 selfcheck.py --json > /tmp/selfcheck.json
          rc=$?
          python3 selfcheck.py || true
          echo "── نتیجه‌ی نگهبان: exit=$rc ──"
          exit $rc

      # ── لایه‌ی ۲: سرورِ واقعی بالا بیاید و صفحه و اندپوینت‌ها جواب بدهند ──
      - name: اسموک‌تستِ سرورِ واقعی
        run: |
          python3 app.py --port 8787 > /tmp/pipfound.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8787/api/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8787/api/health >/dev/null
          echo "سرور بالا آمد ✓"

          page="$(curl -sf http://127.0.0.1:8787/)"
          for id in go bt sym refreshBtn archiveBtn fundBtn sbBtn setupsBtn jbtn; do
            if ! printf '%s' "$page" | grep -q "id=\"$id\""; then
              echo "::error::کلیدِ «$id» در صفحه‌ی سرو‌شده نیست"
              exit 1
            fi
          done
          echo "همه‌ی کلیدهای اصلی در صفحه هستند ✓"

          curl -sf http://127.0.0.1:8787/manifest.webmanifest >/dev/null
          curl -sf http://127.0.0.1:8787/sw.js >/dev/null
          echo "فایل‌های PWA سرو می‌شوند ✓"

          curl -sf http://127.0.0.1:8787/api/selfcheck \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('selfcheck داخلِ اپ:', d.get('ok')); sys.exit(0 if d.get('ok') else 1)"
          echo "اسموک‌تست پاس شد ✓"

      # ── گزارشِ دقیقِ خطاها روی همان کامیت/PR ──
      # ── لایه‌ی ۳: رندرِ واقعی در مرورگرِ headless — «کلیدها غیب نشده‌اند و سیم‌کشی‌اند؟» ──
      # چرا لازم است: یک خطای جاوااسکریپت، دکمه‌ها را در HTML نگه می‌دارد ولی بی‌اثر می‌کند؛
      # چکِ متنیِ HTML این را نمی‌بیند، ولی صفحه‌ی رندرشده لو می‌دهد.
      - name: تستِ بصری و سیم‌کشیِ کلیدها (headless)
        run: |
          set -e
          MODDIR="$RUNNER_TEMP/pf-visual"
          mkdir -p "$MODDIR"
          ( cd "$MODDIR" && npm init -y >/dev/null 2>&1 && npm i puppeteer-core@24 --no-audit --no-fund --silent )
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "مرورگری روی رانر نبود — کرومِ headless نصب می‌شود"
            BROWSER="$(npx --yes @puppeteer/browsers install chrome@stable --path "$MODDIR/browsers" | tail -1 | awk '{print $NF}')"
          fi
          echo "مرورگر: $BROWSER"
          PF_BROWSER="$BROWSER" PF_PUPPETEER_DIR="$MODDIR/node_modules" \
            node ui_visual_check.cjs --url http://127.0.0.1:8787/ --shot "$RUNNER_TEMP/pf-ui.png"

      # ── لایه‌ی ۴: رفت‌وبرگشتِ ژورنال — مسیرِ دفتر، ثبت/خواندن، مهاجرتِ بی‌خطر ──
      # خودش نمونه‌های موقتِ اپ را با HOME و env کنترل‌شده بالا می‌آورد، پس به سرورِ 8787
      # و دفترِ واقعیِ کاربر دست نمی‌زند.
      - name: تستِ رفت‌وبرگشتِ ژورنال (مسیرِ دفتر)
        run: |
          set -e
          python3 journal_roundtrip_test.py

      - name: گزارشِ خطاها
        if: failure()
        run: |
          echo "──────── لاگِ سرور ────────"
          tail -40 /tmp/pipfound.log 2>/dev/null || true
          echo "──────── گزارشِ نگهبان ────────"
          python3 selfcheck.py --json > /tmp/report.json || true
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("/tmp/report.json", encoding="utf-8"))
          except Exception:
              raise SystemExit(0)
          print("مبنا:", d.get("baseline"), "| موتورِ JS:", d.get("engine"))
          for p in (d.get("problems") or []):
              print("::error::" + p)
          for w in (d.get("warnings") or []):
              print("::warning::" + w)
          PY

      # اسکرین‌شاتِ تستِ بصری — برای بازبینیِ انسانی، حتی وقتی تست پاس می‌شود.
      - name: آپلودِ اسکرین‌شاتِ UI
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipfound-ui-screenshot
          path: ${{ runner.temp }}/pf-ui.png
          if-no-files-found: ignore
          retention-days: 7
